# beOkay — DEVELOPMENT stack.
#   docker compose up --build        # jalankan
#   docker compose up --build -V     # setelah dependency berubah (reset volume node_modules)
#   docker compose down              # stop (data DB tetap) | down -v = hapus data DB
# Production: lihat compose.prod.yaml.
name: beokay-dev

services:
  postgres:
    image: pgvector/pgvector:pg17 # pgvector disiapkan untuk tahap P2 (RAG); tidak aktif sampai extension dibuat
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-beokay}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-beokay_dev_password}
      POSTGRES_DB: ${POSTGRES_DB:-beokay}
    ports:
      # Hanya loopback. 5433 agar tidak bentrok dengan Postgres proyek lain di 5432.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  mailpit:
    image: axllent/mailpit:latest # SMTP penampung untuk dev; email tidak keluar ke internet
    restart: unless-stopped
    ports:
      - "127.0.0.1:${MAILPIT_UI_PORT:-8025}:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: ./server
      target: dev
    user: "${HOST_UID:-1000}:${HOST_GID:-1000}" # cegah berkas milik root di bind mount
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_healthy
    environment:
      NODE_ENV: development
      HOME: /tmp
      PORT: "3000"
      DATABASE_URL: postgresql://${POSTGRES_USER:-beokay}:${POSTGRES_PASSWORD:-beokay_dev_password}@postgres:5432/${POSTGRES_DB:-beokay}
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:-dev-only-secret-change-me-0123456789abcdef}
      BETTER_AUTH_URL: http://localhost:${API_HOST_PORT:-3000}
      TRUSTED_ORIGINS: ${TRUSTED_ORIGINS:-http://localhost:${API_HOST_PORT:-3000}}
      TRUST_PROXY: "false"
      EMAIL_DRIVER: smtp
      EMAIL_FROM: "beOkay <no-reply@beokay.local>"
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_SECURE: "false"
      # Opsional; nilai dibaca dari .env (gitignored). Kosong = fitur terkait nonaktif.
      USDA_API_KEY: ${USDA_API_KEY:-}
      MISTRAL_API_KEY: ${MISTRAL_API_KEY:-}
      MISTRAL_BASE_URL: ${MISTRAL_BASE_URL:-https://api.mistral.ai/v1}
      MISTRAL_VISION_MODEL: ${MISTRAL_VISION_MODEL:-}
      MISTRAL_OCR_MODEL: ${MISTRAL_OCR_MODEL:-}
      MISTRAL_EMBEDDING_MODEL: ${MISTRAL_EMBEDDING_MODEL:-}
      UPLOADTHING_TOKEN: ${UPLOADTHING_TOKEN:-}
      BRAVE_API_KEY: ${BRAVE_API_KEY:-}
      FCM_PROJECT_ID: ${FCM_PROJECT_ID:-}
      OUTBOX_WORKER_ENABLED: ${OUTBOX_WORKER_ENABLED:-true}
      MISTRAL_AGENT_MODEL: ${MISTRAL_AGENT_MODEL:-}
      MODAL_ML_URL: ${MODAL_ML_URL:-}
      MODAL_ML_AUTH_TOKEN: ${MODAL_ML_AUTH_TOKEN:-}
      FCM_SERVICE_ACCOUNT_JSON: ${FCM_SERVICE_ACCOUNT_JSON:-}
      # Dev: dispatcher mati agar tidak mengirim push ke perangkat sungguhan dari data uji.
      PUSH_DISPATCH_ENABLED: ${PUSH_DISPATCH_ENABLED_DEV:-false}
    ports:
      - "127.0.0.1:${API_HOST_PORT:-3000}:3000"
    volumes:
      - ./server:/app
      - api_node_modules:/app/node_modules # jangan timpa node_modules image dengan milik host
    healthcheck:
      test: ["CMD", "bun", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

volumes:
  pgdata:
  api_node_modules:
